# A v* tag: the installers for every system and the Android APK, attached to that tag's GitHub release.
# Installers not signed (see shell/electron/builder.yml), macOS ad-hoc; the APK is (see the android job).
# The release is a draft while the builds upload, and published only when all of them succeeded.
# The update files (latest-linux.yml, latest.yml, latest-mac.yml, *.blockmap) go up with the packages: the
# apps read them to update. The Windows and macOS packages it builds have never been started by anyone.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches package.json's version
        run: |
          v=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v$v" || { echo "tag ${GITHUB_REF_NAME} ≠ package.json v$v"; exit 1; }
      - name: Create the draft release (the build jobs upload into it)
        env:
          GH_TOKEN: ${{ github.token }}
        # the notes are written by hand (docs/releases/<tag>.md): no notes, no release
        run: |
          node tools/release-notes.ts "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft \
            --title "Tandem ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    needs: release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, args: "--linux AppImage deb rpm --x64" }
          - { name: windows-x64, os: windows-2025, args: "--win nsis --x64" }
          - { name: macos, os: macos-15, args: "--mac dmg zip --arm64 --x64" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: rpm tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp test
      - run: pnpm exec vp build
      - run: pnpm exec vp pack
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --config shell/electron/builder.yml ${{ matrix.args }} --publish never
      - name: Attach the packages to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" dist/packages/*.{AppImage,deb,rpm,exe,dmg,zip,blockmap} dist/packages/latest*.yml --clobber

  # The Android app (shell/android/main.ts), packed by nodeapk (https://github.com/sigmaSd/nodeapk) and signed
  # with Tandem's release key, so that each APK installs over the previous one. The key and its password are
  # the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets; without them the job fails rather
  # than ship an APK signed with a throwaway key (which phones would refuse to update over).
  android:
    needs: release
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # vendor/nodeapk: the APK is built from its sources, as F-Droid builds it
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp test
      - run: pnpm exec vp build
      - run: pnpm exec vp pack
      - name: APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NODEAPK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$NODEAPK_KEYSTORE_PASSWORD" ] || { echo "the Android signing secrets are missing"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/tandem.keystore"
          v=$(node -p "require('./package.json').version")
          node vendor/nodeapk/src/cli.ts build . --keystore "$RUNNER_TEMP/tandem.keystore" \
            --out "dist/packages/Tandem-$v-android-arm64.apk"
          rm "$RUNNER_TEMP/tandem.keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: dist/packages/*.apk
          if-no-files-found: error
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/packages/*.apk --clobber

  # The APK built again, unsigned, as F-Droid builds it (but with node-android's published Node), and compared
  # by F-Droid's own code: what can't match isn't published. Apart from the android job: what pip installs
  # gets neither the signing key nor a token that can write.
  fdroid-match:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp build
      - run: pnpm exec vp pack
      - run: node vendor/nodeapk/src/cli.ts build . --unsigned --out unsigned.apk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: signed
      - name: F-Droid's comparison
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q fdroidserver==2.4.5
          apksigner=$(find "$HOME/.cache/nodeapk" "$ANDROID_HOME/build-tools" -path '*/35.0.0/apksigner' 2>/dev/null | head -1) || true
          sha256sum unsigned.apk signed/*.apk
          PATH="$(dirname "$apksigner"):$PATH" "$RUNNER_TEMP/venv/bin/python" tools/fdroid-match.py signed/*.apk unsigned.apk

  publish:
    needs: [build, android, fdroid-match]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release, now that every system's packages are in it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
